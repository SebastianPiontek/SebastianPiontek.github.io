<title>Aura Applications | Erstklassige Apps für deinen Alltag</title>
<style>
:root {
  --bg-black: #050505;
  --card-bg: rgba(18, 18, 18, 0.95);
  --gold-champagne: #F3E5AB;
  --gold-primary: #D4AF37;
  --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
  --gold-gradient-animated: linear-gradient(90deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C, #BF953F);
  --text-body: #E0E0E0;
  --text-muted: #B0B0B0;
  --border-gold: rgba(212, 175, 55, 0.35);
  --border-gold-hover: rgba(212, 175, 55, 0.8);
  --radius: 18px;
}
html {
  scroll-behavior: smooth;
}
body {
  background-color: var(--bg-black);
  color: var(--text-body);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 0;
  line-height: 1.6;
  overflow-x: hidden;
}
@keyframes goldFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: var(--bg-black);
}
::-webkit-scrollbar-thumb {
  background: #332a15;
  border-radius: 4px;
  border: 1px solid var(--border-gold);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold-primary);
}
.wrapper {
  max-width: 1080px;
  margin: 0 auto;
  padding: 20px;
}
.header-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 30px;
  background: #0a0a0a;
  border: 1px solid var(--border-gold);
  border-radius: 50px;
  margin-bottom: 40px;
  box-shadow: 0 4px 25px rgba(212, 175, 55, 0.1);
}
.header-brand-box {
  display: flex;
  align-items: center;
  gap: 15px;
}
.brand-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-decoration: none;
  position: relative;
  display: inline-block;
}
.brand-text::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--gold-gradient);
  border-radius: 2px;
}
.nav-links {
  display: flex;
  gap: 20px;
  align-items: center;
}
.nav-text-group {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
}
.nav-links a {
  color: var(--gold-champagne);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  transition: color 0.3s ease;
}
.nav-links a:hover {
  color: var(--gold-primary);
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
}
.nav-btn-group {
  display: flex;
  gap: 10px;
  align-items: center;
}
.lang-select {
  background: rgba(255, 255, 255, 0.05);
  color: var(--gold-champagne);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 5px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  outline: none;
}
.lang-select option {
  background: #121212;
  color: #FFFFFF;
}
.btn-header-cta {
  position: relative;
  overflow: hidden;
  padding: 8px 18px;
  background: var(--gold-gradient);
  color: #000000 !important;
  font-weight: 700 !important;
  border-radius: 20px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  text-shadow: none !important;
  display: inline-block;
  text-align: center;
  text-decoration: none;
}
.btn-header-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 18px rgba(212, 175, 55, 0.4);
}
.hero {
  padding: 20px 20px 40px 20px;
  text-align: center;
}
.hero-logo-emblem {
  width: 170px;
  height: 170px;
  margin: 0 auto 20px auto;
  display: block;
  border-radius: 24px;
  border: 2px solid var(--border-gold);
  box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
  transition: transform 0.4s ease;
  object-fit: cover;
  background-color: #000;
}
.hero-logo-emblem:hover {
  transform: scale(1.03);
}
.badge-hero {
  display: inline-block;
  padding: 6px 18px;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid var(--border-gold);
  border-radius: 20px;
  color: var(--gold-champagne);
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 20px;
  letter-spacing: 1px;
}
.hero h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.8rem;
  margin-bottom: 15px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.gold-animated {
  background: var(--gold-gradient-animated);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: goldFlow 7s ease infinite;
}
.text-champagne {
  color: var(--gold-champagne);
}
.hero p {
  max-width: 680px;
  margin: 0 auto 25px auto;
  color: var(--text-body);
  font-size: 1.05rem;
}
.guarantee-box {
  display: inline-flex;
  gap: 20px;
  background: var(--card-bg);
  border: 1px solid var(--border-gold);
  padding: 10px 25px;
  border-radius: 30px;
  font-size: 0.85rem;
  color: var(--gold-champagne);
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}
.usp-card, .app-card, .dev-profile, .faq-box, .legal-box, .feedback-box {
  position: relative;
  overflow: hidden;
  background: var(--card-bg);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}
.usp-card::after, .app-card::after, .dev-profile::after, .faq-box::after, .legal-box::after, .feedback-box::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -60%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.12) 50%, transparent 70%);
  transform: rotate(25deg) translateX(-100%);
  transition: transform 0.8s ease;
  pointer-events: none;
}
.usp-card:hover, .app-card:hover, .dev-profile:hover, .faq-box:hover, .legal-box:hover, .feedback-box:hover {
  border-color: var(--border-gold-hover);
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
}
.usp-card:hover::after, .app-card:hover::after, .dev-profile:hover::after, .faq-box:hover::after, .legal-box:hover::after, .feedback-box:hover::after {
  transform: rotate(25deg) translateX(100%);
}
.usp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin: 50px 0;
}
.usp-card {
  padding: 22px;
  text-align: center;
}
.usp-card .icon {
  font-size: 1.8rem;
  margin-bottom: 10px;
  display: block;
  color: var(--gold-primary);
}
.usp-card h4 {
  font-family: 'Montserrat', sans-serif;
  margin: 0 0 8px 0;
  background: var(--gold-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.usp-card p {
  margin: 0;
  font-size: 0.85rem;
  color: var(--text-muted);
}
.dev-profile {
  display: flex;
  align-items: center;
  gap: 35px;
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 35px;
  margin: 50px 0;
  user-select: none;
}
.dev-avatar-box {
  text-align: center;
  flex-shrink: 0;
}
.dev-avatar {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 2px solid var(--gold-primary);
  object-fit: cover;
  margin-bottom: 12px;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
}
.dev-name {
  font-family: 'Montserrat', sans-serif;
  margin: 0;
  font-size: 1.15rem;
  color: #FFFFFF;
}
.dev-role {
  font-size: 0.82rem;
  color: var(--gold-primary);
  font-weight: 600;
}
.badge-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
.dev-badge {
  font-size: 0.78rem;
  padding: 4px 12px;
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid var(--border-gold);
  border-radius: 15px;
  color: var(--gold-champagne);
}
.dev-text h3 {
  font-family: 'Montserrat', sans-serif;
  margin-top: 5px;
  font-size: 1.4rem;
  color: var(--gold-champagne);
}
.dev-text p {
  color: var(--text-body);
  font-size: 0.95rem;
  margin-bottom: 12px;
}
.section-title {
  font-family: 'Montserrat', sans-serif;
  text-align: center;
  font-size: 2.2rem;
  margin-bottom: 35px;
  color: var(--gold-champagne);
  font-weight: 700;
}
.app-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
}
.app-card {
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 30px;
  display: flex;
  flex-direction: column;
}
.app-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}
.app-header img {
  width: 65px;
  height: 65px;
  border-radius: 16px;
  border: 1px solid var(--border-gold);
  object-fit: cover;
}
.app-header h3 {
  font-family: 'Montserrat', sans-serif;
  margin: 0;
  font-size: 1.3rem;
  color: var(--gold-primary);
}
.app-card p {
  color: var(--text-body);
  font-size: 0.92rem;
  flex-grow: 1;
  margin-bottom: 25px;
}
.store-button-single {
  width: 100%;
}
.btn-store {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  background: var(--gold-gradient);
  color: #000000;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 700;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}
.btn-store::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -60%;
  width: 200%;
  height: 200%;
  background: linear-gradient(60deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
  transform: rotate(25deg) translateX(-100%);
  transition: transform 0.6s ease;
}
.btn-store:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
}
.btn-store:hover::after {
  transform: rotate(25deg) translateX(100%);
}
.faq-box {
  border-radius: 24px;
  padding: 35px;
  margin: 50px 0;
}
.faq-item {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-gold);
  border-radius: 14px;
  margin-bottom: 12px;
  padding: 16px 20px;
  transition: background 0.3s ease, border-color 0.3s ease;
}
.faq-item[open] {
  background: rgba(212, 175, 55, 0.05);
  border-color: var(--gold-primary);
}
.faq-summary {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.02rem;
  font-weight: 600;
  color: var(--gold-champagne);
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.faq-summary::-webkit-details-marker {
  display: none;
}
.faq-summary::after {
  content: '+';
  font-size: 1.1rem;
  color: var(--gold-primary);
  transition: transform 0.3s ease;
}
.faq-item[open] .faq-summary::after {
  transform: rotate(45deg);
}
.faq-item p {
  color: var(--text-body);
  font-size: 0.92rem;
  margin-top: 12px;
  margin-bottom: 0;
  line-height: 1.6;
}
.feedback-box {
  border-radius: 24px;
  padding: 40px;
  margin: 50px 0;
  text-align: center;
}
.feedback-box .icon {
  font-size: 2.2rem;
  color: var(--gold-primary);
  margin-bottom: 15px;
  display: block;
}
.feedback-box h2 {
  font-family: 'Montserrat', sans-serif;
  font-size: 1.8rem;
  color: var(--gold-champagne);
  margin-top: 0;
  margin-bottom: 12px;
}
.feedback-box p {
  color: var(--text-body);
  font-size: 0.95rem;
  max-width: 600px;
  margin: 0 auto 25px auto;
}
/* AURA TRUST BADGES (RUNDE SCHWARZ-GOLD-MEDAILLEN) */
.trust-badges-container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin: 25px 0 20px 0;
  padding: 0 15px;
}
.trust-badge {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: radial-gradient(circle, #1a1a1a 0%, #080808 100%);
  border: 2px solid var(--gold-primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25), inset 0 0 12px rgba(212, 175, 55, 0.12);
  transition: all 0.3s ease;
  position: relative;
}
.trust-badge i {
  color: var(--gold-primary);
  font-size: 1.25rem;
  margin-bottom: 4px;
}
.trust-badge span {
  font-size: 0.62rem;
  color: var(--gold-champagne);
  line-height: 1.1;
  font-weight: 600;
}
.trust-badge:hover {
  border-color: var(--gold-champagne);
  transform: scale(1.06);
  box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45), inset 0 0 18px rgba(212, 175, 55, 0.25);
}
.legal-box {
  border-radius: 20px;
  padding: 35px;
  margin-top: 50px;
}
.legal-box h2 {
  font-family: 'Montserrat', sans-serif;
  color: var(--gold-champagne);
  font-size: 1.4rem;
  margin-top: 0;
}
.legal-box h3 {
  font-family: 'Montserrat', sans-serif;
  color: var(--gold-primary);
  font-size: 1.05rem;
  margin-top: 20px;
}
.legal-box p,
.legal-box li {
  font-size: 0.88rem;
  color: var(--text-body);
}
.legal-box a {
  color: var(--gold-primary);
  text-decoration: none;
}
.legal-box a:hover {
  text-decoration: underline;
}
hr {
  border: 0;
  height: 1px;
  background: var(--border-gold);
  margin: 40px 0;
}
footer {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 30px;
  padding-bottom: 20px;
}
.scroll-top-wrapper {
  text-align: center;
  margin-top: 25px;
}
.btn-scroll-top {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: var(--card-bg);
  border: 1px solid var(--border-gold);
  border-radius: 25px;
  color: var(--gold-champagne);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
}
.btn-scroll-top:hover {
  background: var(--gold-gradient);
  color: #000000;
  border-color: transparent;
  transform: translateY(-2px);
}
@media (max-width: 768px) {
  .header-nav {
    flex-direction: column;
    gap: 15px;
    border-radius: 25px;
    padding: 18px 20px;
  }
  .header-brand-box {
    width: 100%;
    justify-content: space-between;
  }
  .nav-links {
    flex-direction: column;
    width: 100%;
    gap: 15px;
  }
  .nav-text-group {
    width: 100%;
    justify-content: center;
    gap: 15px;
  }
  .nav-btn-group {
    width: 100%;
  }
  .btn-header-cta {
    width: 100%;
    box-sizing: border-box;
  }
  .dev-profile {
    flex-direction: column;
    text-align: center;
  }
  .badge-group {
    justify-content: center;
  }
  .hero h1 {
    font-size: 2.1rem;
  }
}
</style>

function changeLanguage(lang) {
  if (!translations[lang]) return;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.getAttribute('data-i18n');
    if (translations[lang] && translations[lang][key]) {
      element.textContent = translations[lang][key];
    }
  });
}
