<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Seite nicht gefunden | Aura Applications</title>
    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --bg-dark: #000000;
            --card-bg: rgba(12, 12, 12, 0.95);
            --border-gold: rgba(212, 175, 55, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 50px 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        h2 {
            color: var(--gold-light);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #B0B0B0;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background: var(--gold-gradient);
            color: #000000;
            font-weight: 700;
            text-decoration: none;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <h1 class="error-code">404</h1>
        <h2>Hoppla! Diese Seite existiert hier nicht.</h2>
        <p>Entweder hat sich ein Tippfehler in den Link eingeschlichen oder die gesuchte Seite wurde verschoben. Kehre einfach zur Startseite zurück, um unsere App-Manufaktur zu erkunden.</p>
        <a href="index.html" class="btn-home">➔ Zurück zur Startseite</a>
    </div>

</body>
</html>
