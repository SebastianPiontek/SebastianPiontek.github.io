<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Seite nicht gefunden | Aura Applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #050505;
      --card-bg: #121212;
      --card-border: #222222;
      
      /* Visuelle Farb-Hierarchie */
      --gold-bright: #F3E5AB; /* Champagner-Gold */
      --gold-primary: #D4AF37; /* Messing-Gold */
      --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #AA771C);
      
      --text-white: #FFFFFF;
      --text-body: #E0E0E0;
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-body);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 3.5rem 2rem;
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .error-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 5.5rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      color: var(--gold-bright);
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-body);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* Absoluter Link zur Startseite */
    .btn-home {
      display: inline-block;
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 30px;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="error-code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Sie haben sich eventuell vertippt oder die aufgerufene Seite existiert nicht mehr.</p>
    
    <!-- href="/" garantiert auf GitHub Pages den Sprung zur Startseite -->
    <a href="/" class="btn-home">Zurück zur Startseite</a>
  </div>

</body>
</html>
