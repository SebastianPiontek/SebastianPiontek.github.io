    <style>
        /* --- CORE DESIGN TOKENS (AMOLED LUXURY GOLD) --- */
        :root {
            --amoled-black: #000000;
            --surface-gray: #121418;
            --gold-accent: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --text-white: #FFFFFF;
            --text-muted: #94A3B8;
            --success-green: #10B981;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--amoled-black);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- GLOBAL UI SHELL --- */
        .app-shell {
            max-width: 448px;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: var(--amoled-black);
            padding: 24px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Fixed Top Header */
        .global-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 37px;
            height: 37px;
            background: var(--gold-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #1C1A14;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--gold-accent);
            letter-spacing: -0.5px;
        }

        .brand-subline {
            font-size: 10px;
            color: var(--text-muted);
            display: block;
            margin-top: -2px;
        }

        .pro-badge {
            background: var(--gold-gradient);
            color: #1C1A14;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* --- PRIVACY SECURITY BANNER --- */
        .security-banner {
            background-color: var(--surface-gray);
            border: 1px solid var(--gold-accent);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .security-banner h2 {
            font-size: 14px;
            color: var(--gold-accent);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .security-banner p {
            font-size: 12px;
            color: var(--text-white);
        }

        /* --- BENTO GRID CONTAINER --- */
        .bento-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .bento-card {
            background-color: var(--surface-gray);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .bento-card:active {
            transform: scale(0.97);
            border-color: var(--gold-accent);
        }

        .card-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background-color: rgba(212, 175, 55, 0.08);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-white);
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* --- DRAG & DROP WIZARD INTERFACE --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .wizard-container {
            width: 100%;
            max-width: 408px;
            background-color: var(--surface-gray);
            border: 1px solid var(--gold-accent);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .close-wizard {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .wizard-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gold-accent);
            margin-bottom: 4px;
        }

        .wizard-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            margin-bottom: 20px;
        }

        .upload-zone:hover, .upload-zone:active {
            border-color: var(--gold-accent);
            background-color: rgba(212, 175, 55, 0.03);
        }

        .upload-icon {
            font-size: 36px;
            margin-bottom: 12px;
            display: block;
        }

        .upload-text {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .upload-hint {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Formular Felder */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-white);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            background-color: var(--amoled-black);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-white);
            font-size: 13px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--gold-accent);
        }

        /* Metallic Gold Button */
        .btn-gold {
            width: 100%;
            background: var(--gold-gradient);
            color: #1C1A14;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-gold:active {
            transform: scale(0.98);
        }

        /* --- LEGAL ENGINE (ACCORDION) --- */
        .legal-section {
            margin-top: auto;
            border-top: 1px solid rgba(212, 175, 55, 0.15);

        .accordion-item {
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: var(--surface-gray);
            overflow: hidden;
        }

        .accordion-header {
            width: 100%;
            background: none;
            border: none;
            padding: 16px;
            text-align: left;
            color: var(--gold-accent);
            font-size: 12px;

text-transform: uppercase;

    <script>
        function toggleAccordion(id) {
            const content = document.getElementById(id);
            const header = content.previousElementSibling;
            const indicator = header.querySelector('span:last-child');
            
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                indicator.textContent = '+';
            } else {
                document.querySelectorAll('.accordion-content').forEach(el => {
                    el.style.maxHeight = '0px';
                    el.previousElementSibling.querySelector('span:last-child').textContent = '+';
                });
                content.style.maxHeight = content.scrollHeight + "px";
                indicator.textContent = '−';
            }
        }

        function openWizard(title, description) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = description;
            document.getElementById('wizardModal').classList.add('active');
            document.getElementById('admobBanner').classList.add('collapse');
        }

        function closeWizard() {
            document.getElementById('wizardModal').classList.remove('active');
            document.getElementById('admobBanner').classList.remove('collapse');
        }

        function simulateProcessing() {
            alert('Aura PDF Studio: Die Datei-Transformation wurde zu 100% serverlos in deinem Browser-RAM berechnet und als verschlüsselter Download auf deiner Festplatte abgelegt! 🚀');
            closeWizard();
        }
    </script>
